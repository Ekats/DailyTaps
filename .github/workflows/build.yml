name: Build

# Runs the unit tests and builds a release APK signed with the public test key in
# .github/test-signing, so every build installs as an update over the previous one.
# Pushes to main and claude/** branches also replace the "test-build" pre-release:
# https://github.com/<owner>/<repo>/releases/download/test-build/dailytaps-test.apk
on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK signed with the test key
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.github/test-signing/test.keystore
          ANDROID_SIGNING_STORE_PASSWORD: dailytaps-test
          ANDROID_SIGNING_KEY_ALIAS: dailytaps-test
          ANDROID_SIGNING_KEY_PASSWORD: dailytaps-test
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dailytaps-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dailytaps-test-apk
          path: dailytaps-test.apk

      - name: Replace the test-build pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build dailytaps-test.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Test build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Test build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Signed with the public test key, not for distribution."

      # Last, so lint findings never hold back the test APK.
      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
